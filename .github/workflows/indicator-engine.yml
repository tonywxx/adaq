name: Indicator engine acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/indicator-engine.yml'
      - 'docs/reference/component-manifest.md'
      - 'docs/reference/component-manifest.schema.json'
      - 'examples/components/**'
      - 'src-tauri/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/indicator-engine.yml'
      - 'docs/reference/component-manifest.md'
      - 'docs/reference/component-manifest.schema.json'
      - 'examples/components/**'
      - 'src-tauri/**'

jobs:
  native-acceptance:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    env:
      Platform: ${{ matrix.runner == 'windows-latest' && 'x64' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            runner: macos-14
            architecture: arm64
          - name: Windows x86_64
            runner: windows-latest
            architecture: x86_64
          - name: Linux x86_64
            runner: ubuntu-latest
            architecture: x86_64
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Verify native architecture
        if: matrix.architecture == 'arm64'
        shell: bash
        run: test "$(uname -m)" = arm64
      - name: Install cargo-component
        run: cargo install cargo-component --locked
      - name: Build component fixtures
        working-directory: src-tauri
        shell: bash
        run: |
          set -euo pipefail
          for fixture in strategy factor model external-strategy mixed-strategy multi-output-factor repeated-factor-strategy; do
            cargo component build --manifest-path "fixtures/$fixture/Cargo.toml" --target wasm32-unknown-unknown
          done
      - name: Build and verify public Component examples
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path src-tauri/crates/adaq-component-tooling/Cargo.toml --bin adaq-component
          cli="$GITHUB_WORKSPACE/src-tauri/target/debug/adaq-component"
          if [ "$RUNNER_OS" = Windows ]; then cli="${cli}.exe"; fi
          for example in factor-close-momentum-5 strategy-momentum-trend; do
            cd "$GITHUB_WORKSPACE/examples/components/$example"
            "$cli" build
            "$cli" verify "dist/$example-0.1.0.adaq"
          done
      - name: Verify generated Catalog and independent vectors
        working-directory: src-tauri
        shell: bash
        run: sh crates/adaq-indicator-engine/scripts/check_generated.sh
      - name: Run official TA-Lib C regression suite
        working-directory: src-tauri
        shell: bash
        run: sh crates/adaq-indicator-engine/scripts/verify_talib_regtest.sh
      - name: Run Catalog and mixed-Run acceptance suites
        working-directory: src-tauri
        run: cargo test --workspace
