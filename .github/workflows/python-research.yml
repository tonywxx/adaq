name: Python Research contracts

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/python-research.yml"
      - "examples/python/**"
      - "python/**"
      - "src-tauri/**"
      - "docs/**"
      - "src/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/python-research.yml"
      - "examples/python/**"
      - "python/**"
      - "src-tauri/**"
      - "docs/**"
      - "src/**"

permissions:
  contents: read

jobs:
  contracts:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    env:
      Platform: ${{ matrix.runner == 'windows-latest' && 'x64' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            runner: macos-14
            full_tutorial: false
          - name: Windows x86_64
            runner: windows-latest
            full_tutorial: false
          - name: Linux x86_64
            runner: ubuntu-latest
            full_tutorial: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Setup MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Factor build target
        run: rustup target add wasm32-unknown-unknown
      - name: Fetch offline Factor fixture dependencies
        run: cargo fetch --locked --manifest-path src-tauri/fixtures/factor/Cargo.toml
      - name: Install cargo-component
        run: cargo install cargo-component --locked
      - name: Build Factor test fixtures (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cargo component build --manifest-path src-tauri/fixtures/factor/Cargo.toml --target wasm32-unknown-unknown
          cargo component build --manifest-path src-tauri/fixtures/cross-sectional-factor/Cargo.toml --target wasm32-unknown-unknown
      - name: Build Factor test fixtures (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo component build --manifest-path src-tauri/fixtures/factor/Cargo.toml --target wasm32-unknown-unknown
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo component build --manifest-path src-tauri/fixtures/cross-sectional-factor/Cargo.toml --target wasm32-unknown-unknown
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Run managed SDK and Runner contracts
        shell: bash
        run: |
          set -euo pipefail
          python python/contract_tests/run_contract_tests.py
          python python/runner_tests/run_runner_tests.py
          python python/tutorial_tests/run_tutorial_tests.py
          python -m compileall -q python
      - name: Run Python Research Rust contracts
        working-directory: src-tauri
        run: cargo test -p adaq-python-research -- --test-threads=1
      - name: Run Factor integration contracts
        working-directory: src-tauri
        run: cargo test -p adaq-factor-research --lib --test benchmarks --test metric_golden -- --test-threads=1
      - name: Run offline Factor-to-Model tutorial
        if: matrix.full_tutorial || github.event_name != 'pull_request'
        working-directory: src-tauri
        run: |
          cargo test -p adaq --lib tutorial_golden_contracts_cover_fixture_windows_and_model_boundaries -- --test-threads=1
          cargo test -p adaq --lib factor_vertical_publishes_dataset_reports_and_promotion_evidence -- --test-threads=1
      - name: Build frontend
        run: pnpm run build
      - name: Lint frontend
        run: pnpm run lint
      - name: Check formatting and paths
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path src-tauri/Cargo.toml --all --check
          git diff --check
          if rg -n '(/Users/|/home/|[A-Za-z]:\\Users\\|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY)' python examples/python src-tauri/crates/adaq-python-research src-tauri/src/python_research; then
            echo "private absolute path or key material found" >&2
            exit 1
          fi

  workspace:
    if: github.event_name != 'pull_request'
    name: Supported workspace and tutorial (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            runner: macos-14
          - name: Windows x86_64
            runner: windows-latest
          - name: Linux x86_64
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Setup MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf
      - name: Install Factor build target
        run: rustup target add wasm32-unknown-unknown
      - name: Fetch offline Factor fixture dependencies
        run: cargo fetch --locked --manifest-path src-tauri/fixtures/factor/Cargo.toml
      - name: Install cargo-component
        run: cargo install cargo-component --locked
      - name: Build component fixtures (Unix)
        if: runner.os != 'Windows'
        working-directory: src-tauri
        shell: bash
        run: |
          set -euo pipefail
          for fixture in strategy factor model external-strategy mixed-strategy multi-output-factor repeated-factor-strategy cross-sectional-factor; do
            cargo component build --manifest-path "fixtures/$fixture/Cargo.toml" --target wasm32-unknown-unknown
          done
      - name: Build component fixtures (Windows)
        if: runner.os == 'Windows'
        working-directory: src-tauri
        shell: pwsh
        run: |
          $fixtures = @('strategy', 'factor', 'model', 'external-strategy', 'mixed-strategy', 'multi-output-factor', 'repeated-factor-strategy', 'cross-sectional-factor')
          foreach ($fixture in $fixtures) {
            cargo component build --manifest-path "fixtures/$fixture/Cargo.toml" --target wasm32-unknown-unknown
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build public Component examples (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path src-tauri/crates/adaq-component-tooling/Cargo.toml --bin adaq-component
          cli="$GITHUB_WORKSPACE/src-tauri/target/debug/adaq-component"
          for example in factor-close-momentum-5 strategy-momentum-trend; do
            cd "$GITHUB_WORKSPACE/examples/components/$example"
            "$cli" build
          done
      - name: Build public Component examples (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --manifest-path src-tauri/crates/adaq-component-tooling/Cargo.toml --bin adaq-component
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cli = Join-Path $env:GITHUB_WORKSPACE 'src-tauri/target/debug/adaq-component.exe'
          foreach ($example in @('factor-close-momentum-5', 'strategy-momentum-trend')) {
            Set-Location (Join-Path $env:GITHUB_WORKSPACE "examples/components/$example")
            & $cli build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - run: pnpm install --frozen-lockfile
      - name: Run full Rust workspace and tutorial contracts
        working-directory: src-tauri
        run: cargo test --workspace -- --test-threads=1
      - run: python python/contract_tests/run_contract_tests.py
      - run: python python/runner_tests/run_runner_tests.py
      - run: python python/tutorial_tests/run_tutorial_tests.py
      - run: pnpm exec jest --watchman=false --runInBand
      - run: pnpm run build
