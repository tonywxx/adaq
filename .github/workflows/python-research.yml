name: Python Research contracts

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/python-research.yml"
      - "examples/python/**"
      - "python/**"
      - "src-tauri/**"
      - "docs/**"
      - "src/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/python-research.yml"
      - "examples/python/**"
      - "python/**"
      - "src-tauri/**"
      - "docs/**"
      - "src/**"

permissions:
  contents: read

jobs:
  contracts:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            runner: macos-14
          - name: Windows x86_64
            runner: windows-latest
          - name: Linux x86_64
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Run managed SDK and Runner contracts
        shell: bash
        run: |
          set -euo pipefail
          python python/contract_tests/run_contract_tests.py
          python python/runner_tests/run_runner_tests.py
          python python/tutorial_tests/run_tutorial_tests.py
          python -m compileall -q python
      - name: Run Python Research Rust contracts
        working-directory: src-tauri
        run: cargo test -p adaq-python-research -- --test-threads=1
      - name: Run Factor integration contracts
        working-directory: src-tauri
        run: cargo test -p adaq-factor-research --lib --test benchmarks --test metric_golden -- --test-threads=1
      - name: Run offline Factor-to-Model tutorial
        if: runner.os == 'Linux' || github.event_name != 'pull_request'
        working-directory: src-tauri
        run: cargo test -p adaq --lib factor_vertical_publishes_dataset_reports_and_promotion_evidence -- --test-threads=1
      - name: Build frontend
        run: pnpm run build
      - name: Lint frontend
        run: pnpm run lint
      - name: Check formatting and paths
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path src-tauri/Cargo.toml --all --check
          git diff --check
          if rg -n '(/Users/|/home/|[A-Za-z]:\\Users\\|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY)' python examples/python src-tauri/crates/adaq-python-research src-tauri/src/python_research; then
            echo "private absolute path or key material found" >&2
            exit 1
          fi

  workspace:
    if: github.event_name != 'pull_request'
    name: Linux workspace and tutorial
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - working-directory: src-tauri
        run: cargo test --workspace -- --test-threads=1
      - run: python python/contract_tests/run_contract_tests.py
      - run: python python/runner_tests/run_runner_tests.py
      - run: python python/tutorial_tests/run_tutorial_tests.py
      - run: pnpm exec jest --watchman=false --runInBand
      - run: pnpm run build
