name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate version and tag
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION=$(node --input-type=module -e '
            import fs from "node:fs"
            const version = JSON.parse(fs.readFileSync("package.json","utf8")).version
            if (!/^\d+\.\d+\.\d+$/.test(version)) {
              throw new Error(`package.json has invalid version ${version}`)
            }
            const tauri = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json","utf8")).version
            const cargo = fs.readFileSync("src-tauri/Cargo.toml","utf8")
            const cargoVersion = cargo.match(/^version = "([^"]+)"/m)?.[1]
            for (const [file, actual] of Object.entries({tauri, cargoVersion})) {
              if (actual !== version) {
                throw new Error(`${file} is ${actual}; expected ${version}`)
              }
            }
            process.stdout.write(version)
          ')

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            if [[ "${GITHUB_REF_TYPE}" != "tag" || ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Release pushes must use a tag like v0.9.1, got ${GITHUB_REF_NAME}." >&2
              exit 1
            fi
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "${TAG_VERSION}" != "${VERSION}" ]]; then
              echo "Tag ${GITHUB_REF_NAME} does not match repository version ${VERSION}." >&2
              exit 1
            fi
          else
            if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
              echo "Manual releases must run from main, got ${GITHUB_REF}." >&2
              exit 1
            fi
            if git rev-parse --verify --quiet "refs/tags/v${VERSION}"; then
              echo "Tag v${VERSION} already exists." >&2
              exit 1
            fi
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

  m12_acceptance:
    name: M12 acceptance (${{ matrix.name }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            runner: macos-14
          - name: Windows x86_64
            runner: windows-latest
          - name: Linux x86_64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Setup MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - name: Run M12 Python contracts and tutorial Golden
        working-directory: src-tauri
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test -p adaq-python-research -- --test-threads=1
          cargo test -p adaq --lib tutorial_golden_contracts_cover_fixture_windows_and_model_boundaries -- --test-threads=1
          cargo test -p adaq --lib factor_vertical_publishes_dataset_reports_and_promotion_evidence -- --test-threads=1
      - name: Run repository tutorial parity
        shell: bash
        run: |
          set -euo pipefail
          python python/tutorial_tests/run_tutorial_tests.py
          git diff --check

  build:
    name: Build ${{ matrix.name }}
    needs:
      - validate
      - m12_acceptance
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            platform: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: Windows x86_64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Setup MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Supabase configuration
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          : "${VITE_SUPABASE_URL:?Set repository variable VITE_SUPABASE_URL before releasing.}"
          : "${VITE_SUPABASE_PUBLISHABLE_KEY:?Set repository variable VITE_SUPABASE_PUBLISHABLE_KEY before releasing.}"

      - name: Build and upload draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && '-' || '' }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        with:
          tagName: v${{ needs.validate.outputs.version }}
          releaseName: v${{ needs.validate.outputs.version }}
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          updaterJsonPreferNsis: true
          retryAttempts: 2
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

  publish:
    name: Publish release
    needs:
      - validate
      - build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: v${{ needs.validate.outputs.version }}

    steps:
      - name: Validate updater manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/release"
          gh release download "${TAG}" --pattern latest.json --dir "${RUNNER_TEMP}/release"
          node --input-type=module - "${RUNNER_TEMP}/release/latest.json" <<'NODE'
          import fs from 'node:fs'

          const latest = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))
          const platforms = Object.keys(latest.platforms ?? {})
          for (const expected of ['darwin-aarch64', 'windows-x86_64']) {
            if (!platforms.some((platform) => platform === expected || platform.startsWith(`${expected}-`))) {
              throw new Error(`latest.json is missing ${expected}`)
            }
          }
          NODE

      - name: Publish draft release
        run: gh release edit "${TAG}" --draft=false --latest
