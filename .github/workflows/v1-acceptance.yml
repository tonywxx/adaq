name: V1 Acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/v1-acceptance.yml'
      - 'docs/**'
      - 'examples/components/**'
      - 'examples/python/**'
      - 'python/**'
      - 'src/**'
      - 'src-tauri/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/v1-acceptance.yml'
      - 'docs/**'
      - 'examples/components/**'
      - 'examples/python/**'
      - 'python/**'
      - 'src/**'
      - 'src-tauri/**'

permissions:
  contents: read

jobs:
  acceptance:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    env:
      Platform: ${{ matrix.runner == 'windows-latest' && 'x64' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            runner: macos-14
            architecture: arm64
            target: aarch64-apple-darwin
          - name: Windows x86_64
            runner: windows-latest
            architecture: x86_64
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Setup MSVC environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/setup-msvc.ps1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Verify native architecture
        if: matrix.architecture == 'arm64'
        shell: bash
        run: test "$(uname -m)" = arm64
      - name: Fetch offline Factor fixture dependencies
        run: cargo fetch --locked --manifest-path src-tauri/fixtures/factor/Cargo.toml
      - name: Install cargo-component
        run: cargo install cargo-component --locked
      - name: Build component fixtures (Unix)
        if: runner.os != 'Windows'
        working-directory: src-tauri
        shell: bash
        run: |
          set -euo pipefail
          for fixture in strategy factor model external-strategy portfolio-strategy mixed-strategy multi-output-factor repeated-factor-strategy cross-sectional-factor; do
            cargo component build --manifest-path "fixtures/$fixture/Cargo.toml" --target wasm32-unknown-unknown
          done
      - name: Build component fixtures (Windows)
        if: runner.os == 'Windows'
        working-directory: src-tauri
        shell: pwsh
        run: |
          $fixtures = @('strategy', 'factor', 'model', 'external-strategy', 'portfolio-strategy', 'mixed-strategy', 'multi-output-factor', 'repeated-factor-strategy', 'cross-sectional-factor')
          foreach ($fixture in $fixtures) {
            cargo component build --manifest-path "fixtures/$fixture/Cargo.toml" --target wasm32-unknown-unknown
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build and verify public Component examples (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path src-tauri/crates/adaq-component-tooling/Cargo.toml --bin adaq-component
          cli="$GITHUB_WORKSPACE/src-tauri/target/debug/adaq-component"
          for example in factor-close-momentum-5 strategy-momentum-trend; do
            cd "$GITHUB_WORKSPACE/examples/components/$example"
            "$cli" build
            "$cli" verify "dist/$example-0.1.0.adaq"
          done
      - name: Build and verify public Component examples (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --manifest-path src-tauri/crates/adaq-component-tooling/Cargo.toml --bin adaq-component
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cli = Join-Path $env:GITHUB_WORKSPACE 'src-tauri/target/debug/adaq-component.exe'
          foreach ($example in @('factor-close-momentum-5', 'strategy-momentum-trend')) {
            Set-Location (Join-Path $env:GITHUB_WORKSPACE "examples/components/$example")
            & $cli build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $cli verify "dist/$example-0.1.0.adaq"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Verify generated Catalog and independent vectors
        working-directory: src-tauri
        shell: bash
        run: sh crates/adaq-indicator-engine/scripts/check_generated.sh
      - name: Verify Feature reference vectors regenerate without diff
        working-directory: src-tauri
        shell: bash
        run: sh crates/adaq-feature-engine/scripts/check_generated.sh
      - name: Verify Factor references regenerate without diff
        working-directory: src-tauri
        shell: bash
        run: sh crates/adaq-factor-research/scripts/check_generated.sh
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Stage unsigned Bot Worker for acceptance compilation
        env:
          ADAQ_WORKER_TARGET: ${{ matrix.target }}
          ADAQ_WORKER_ALLOW_UNSIGNED: '1'
        run: pnpm run worker:prepare
      - name: Run managed SDK and Runner contracts
        shell: bash
        run: |
          set -euo pipefail
          python python/contract_tests/run_contract_tests.py
          python python/runner_tests/run_runner_tests.py
          python python/tutorial_tests/run_tutorial_tests.py
          python -m compileall -q python
      - name: Run Python Research Rust contracts
        working-directory: src-tauri
        run: cargo test -p adaq-python-research -- --test-threads=1
      - name: Run Factor integration contracts
        working-directory: src-tauri
        run: cargo test -p adaq-factor-research --lib --test benchmarks --test metric_golden -- --test-threads=1
      - name: Run offline Factor-to-Model tutorial
        if: github.event_name != 'pull_request'
        working-directory: src-tauri
        run: |
          cargo test -p adaq --lib tutorial_golden_contracts_cover_fixture_windows_and_model_boundaries -- --test-threads=1
          cargo test -p adaq --lib factor_vertical_publishes_dataset_reports_and_promotion_evidence -- --test-threads=1
      - name: Run Catalog and mixed-Run acceptance suites
        working-directory: src-tauri
        run: cargo test --workspace
      - name: Build frontend
        run: pnpm run build
      - name: Lint frontend
        run: pnpm run lint
      - name: Run frontend tests (macOS main)
        if: matrix.architecture == 'arm64' && github.event_name != 'pull_request'
        run: pnpm exec jest --watchman=false --runInBand
      - name: Check formatting and paths
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path src-tauri/Cargo.toml --all --check
          git diff --check
          if rg -n '(/Users/|/home/|[A-Za-z]:\\Users\\|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY)' python examples/python src-tauri/crates/adaq-python-research src-tauri/src/python_research; then
            echo "private absolute path or key material found" >&2
            exit 1
          fi
      - name: Run Feature benchmark workloads (macOS)
        if: matrix.architecture == 'arm64'
        working-directory: src-tauri
        run: |
          cargo test -p adaq-feature-engine --release --test benchmarks -- --ignored --test-threads=1
          git diff --exit-code -- crates/adaq-feature-engine/fixtures
      - name: Run Factor benchmark workloads (macOS)
        if: matrix.architecture == 'arm64'
        working-directory: src-tauri
        run: |
          cargo test -p adaq-factor-research --release --test benchmarks -- --ignored --test-threads=1
          git diff --exit-code -- crates/adaq-factor-research/fixtures
