schema-version = "1.0.0"
project-id = "py-factor-cross-sectional-momentum"
kind = "factor"
mode = "portable-definition"
scope = "cross-sectional"
entry-point = "project:create_project"
sdk-profile = "adaq-research-sdk@1"
runtime-profile = "adaq-python@1"
source-files = ["src/project.py"]
dependency-lock-sha256 = "b027f63f692a8cbb9e0fe806da51f0bc4bf15c1fdff7fdd3608d934b15ad660f"
license = "Apache-2.0"

[[parameters]]
id = "lookback"
type = "integer"
default = "20"
allowed-values = ["5", "20", "60"]

[[input-slots]]
id = "close"
role = "market-close"
scope = "cross-sectional"
required = true

[[outputs]]
id = "momentum-score"
value-type = "finite-f64"
required = true

[signal]
id = "momentum-score"
kind = "factor"
value-scale = "percentile"

[resource-request]
max-wall-ms = 1800000
max-memory-bytes = 4294967296
max-threads = 64
max-input-rows = 10000000
max-output-rows = 10000000
