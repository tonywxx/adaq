<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AdaQ</title>
    <style>
      :root {
        color-scheme: light dark;
        background: #ececec;
        color: #111111;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      body {
        margin: 0;
      }
      #app-bootstrap {
        display: grid;
        min-height: 100vh;
        place-content: center;
        justify-items: center;
        gap: 12px;
      }
      #app-bootstrap-spinner {
        width: 28px;
        height: 28px;
        border: 3px solid rgba(17, 17, 17, 0.18);
        border-top-color: #89c764;
        border-radius: 999px;
        animation: app-bootstrap-spin 0.8s linear infinite;
      }
      #app-bootstrap strong {
        font-size: 16px;
      }
      #app-bootstrap span {
        color: #666666;
        font-size: 13px;
      }
      @keyframes app-bootstrap-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-color-scheme: dark) {
        :root {
          background: #1f1f1f;
          color: #f5f5f5;
        }
        #app-bootstrap-spinner {
          border-color: rgba(245, 245, 245, 0.18);
          border-top-color: #aadb85;
        }
        #app-bootstrap span {
          color: #a8a8a8;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-bootstrap-spinner {
          animation-duration: 1.6s;
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <main id="app-bootstrap" role="status" aria-label="AdaQ is initializing">
        <div id="app-bootstrap-spinner" aria-hidden="true"></div>
        <strong>AdaQ</strong>
        <span>Initializing workspace…</span>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
