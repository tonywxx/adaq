<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AdaQ</title>
    <script>
      (() => {
        if (typeof performance !== "undefined") {
          performance.mark("adaq:webview-start");
        }
        try {
          const preference = localStorage.getItem("adaq.interfaceLocale");
          const systemLanguage = navigator.languages?.[0] ?? navigator.language ?? "en-US";
          const locale =
            preference === "zh-CN" ||
            (preference !== "en-US" && /^zh(?:-|$)/i.test(systemLanguage))
              ? "zh-CN"
              : "en-US";
          document.documentElement.lang = locale;
        } catch {
          document.documentElement.lang = "en-US";
        }
      })();
    </script>
    <style>
      :root {
        color-scheme: light dark;
        background: #ececec;
        color: #111111;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      body {
        margin: 0;
      }
    </style>
  </head>

  <body>
    <div id="root">
        <strong>AdaQ</strong>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
