[package]
name = "adaq"
version = "0.8.6"
description = "AI Quant Trading"
authors = ["TONy.W"]
edition = "2024"

[workspace]
members = [
    "crates/adaq-data-core",
    "crates/adaq-backtest-core",
    "crates/adaq-component-sdk",
    "crates/adaq-component-tooling",
    "crates/adaq-indicator-engine",
]
resolver = "2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "adaq_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
adaq-data-core = { path = "crates/adaq-data-core" }
adaq-backtest-core = { path = "crates/adaq-backtest-core" }
adaq-component-sdk = { path = "crates/adaq-component-sdk", features = ["host"] }
adaq-component-tooling = { path = "crates/adaq-component-tooling" }
adaq-indicator-engine = { path = "crates/adaq-indicator-engine" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-log = "2"
tauri-plugin-http = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
rust_decimal = "1"
sha2 = "0.11"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
arrow-array = "59.1"
arrow-schema = "59.1"
parquet = { version = "59.1", default-features = false, features = ["arrow", "snap"] }

[dev-dependencies]
zip = { version = "8", default-features = false, features = ["deflate"] }
