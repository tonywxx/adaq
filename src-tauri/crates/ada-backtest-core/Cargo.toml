[package]
name = "ada-backtest-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
ada-data-core = { path = "../ada-data-core" }
arrow-array = "58.3"
arrow-schema = "58.3"
parquet = { version = "58.3", default-features = false, features = ["arrow", "snap"] }
rust_decimal = { version = "1", features = ["serde-with-str"] }
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
uuid = { version = "1", features = ["serde", "v4"] }
wasmparser = { version = "0.251", features = ["component-model"] }
zip = { version = "7", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
