[package]
name = "adaq-backtest-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
adaq-data-core = { path = "../adaq-data-core" }
arrow-array = "59.2"
arrow-schema = "59.2"
parquet = { version = "59.2", default-features = false, features = ["arrow", "snap"] }
rust_decimal = { version = "1", features = ["serde-with-str"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"
