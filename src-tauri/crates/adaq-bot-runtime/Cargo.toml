[package]
name = "adaq-bot-runtime"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Host-owned, fail-closed Trading Bot runtime contracts"

[dependencies]
base64 = "0.23.1"
ed25519-dalek = { version = "2", features = ["pem", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[[bin]]
name = "adaq-worker-sign"
path = "src/bin/adaq-worker-sign.rs"

[[bin]]
name = "adaq-worker-probe"
path = "src/bin/adaq-worker-probe.rs"
