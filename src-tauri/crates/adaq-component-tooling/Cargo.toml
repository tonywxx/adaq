[package]
name = "adaq-component-tooling"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Package and conformance tooling for ADAQ Components"
repository = "https://github.com/tonywxx/adaq"
readme = "README.md"
include = ["/src/**/*", "/templates/**/*", "/component-manifest.contract.json", "/README.md"]

[[bin]]
name = "adaq-component"
path = "src/bin/adaq-component.rs"

[dependencies]
adaq-component-sdk = { path = "../adaq-component-sdk", version = "=0.1.0", features = ["host"] }
adaq-feature-engine = { path = "../adaq-feature-engine" }
adaq-indicator-engine = { path = "../adaq-indicator-engine" }
base64 = "0.23.1"
rust_decimal = "1"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
uuid = { version = "1", features = ["serde", "v4"] }
wasmparser = { version = "0.254", features = ["component-model"] }
wasmtime = { version = "47.0.3", default-features = false, features = [
    "std",
    "runtime",
    "component-model",
    "cranelift",
] }
zip = { version = "8", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
