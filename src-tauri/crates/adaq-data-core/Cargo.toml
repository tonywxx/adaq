[package]
name = "adaq-data-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[features]
default = []
deferred-equity = ["dep:akshare", "dep:adaq-data-stock-cn", "dep:adaq-data-stock-us"]

[dependencies]
akshare = { version = "=0.1.14", default-features = false, features = ["equity", "misc"], optional = true }
adaq-data-stock-cn = { version = "0.1.4", optional = true }
adaq-data-stock-us = { version = "0.1.2", optional = true }
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
futures-util = "0.3.34"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
rust_decimal = { version = "1", features = ["serde-with-str"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
adaq-trading-crypto = { version = "1.1.1", features = ["okx", "realtime"] }
time = { version = "0.3", default-features = false }
tokio = { version = "1", features = ["macros", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }

[target.'cfg(windows)'.dependencies]
openssl = { version = "0.10.81", features = ["vendored"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
