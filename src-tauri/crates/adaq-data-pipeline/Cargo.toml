[package]
name = "adaq-data-pipeline"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[features]
default = []
deferred-equity = ["adaq-data-core/deferred-equity"]

[dependencies]
adaq-data-core = { path = "../adaq-data-core", default-features = false }
arrow-array = "59.2"
arrow-schema = "59.2"
chrono = { version = "0.4", default-features = false, features = ["std"] }
parquet = { version = "59.2", default-features = false, features = ["arrow", "snap"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"

[dev-dependencies]
adaq-backtest-core = { path = "../adaq-backtest-core" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
