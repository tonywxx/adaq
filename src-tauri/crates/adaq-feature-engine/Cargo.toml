[package]
name = "adaq-feature-engine"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Tauri-independent feature engineering contracts for ADAQ"
build = "build.rs"

[dependencies]
adaq-data-core = { path = "../adaq-data-core" }
adaq-indicator-engine = { path = "../adaq-indicator-engine" }
arrow-array = "59.2"
arrow-schema = "59.2"
chrono = { version = "0.4", default-features = false, features = ["std"] }
parquet = { version = "59.2", default-features = false, features = ["arrow", "snap"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
rust_decimal = "1"
uuid = { version = "1", features = ["serde", "v4"] }

[build-dependencies]
sha2 = "0.11"

[dev-dependencies]
libc = "0.2"
tempfile = "3"
