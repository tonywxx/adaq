[package]
build = "build.rs"
description = "Pinned native TA-Lib indicator engine for ADAQ"
edition = "2024"
license = "Apache-2.0"
name = "adaq-indicator-engine"
version = "0.1.0"

# Backend selection.
# - `backend-rust` (default): pure-Rust `adaq-talib`, zero-FFI. This is the primary engine.
# - `backend-c`: the original pinned C TA-Lib build, retained as a drop-in backup.
# Both can be enabled at once to run cross-backend verification tests.
[features]
backend-c = ["cmake", "flate2", "tar"]
backend-rust = ["dep:adaq-talib"]
default = ["backend-rust"]

[build-dependencies]
sha2 = "0.11"
# C backend build toolchain. Only compiled when `backend-c` is active, but the build
# script still runs (and emits the env vars lib.rs requires) under either backend.
cmake = {version = "0.1", optional = true}
flate2 = {version = "1", optional = true}
tar = {version = "0.4", optional = true}

[dependencies]
serde = {version = "1", features = ["derive"]}
serde_json = "1"
# Pure-Rust TA-Lib reimplementation used by `backend-rust`.
# Published pure-Rust TA-Lib reimplementation. The local checkout at
# `/Users/tony/github/adaq-talib` is used for development/reference only.
adaq-talib = {version = "0.2.1", optional = true}
