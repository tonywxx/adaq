[package]
name = "adaq-paper-trading-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Host-owned paper account, order, fill, and reconciliation contracts"

[dependencies]
rust_decimal = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
