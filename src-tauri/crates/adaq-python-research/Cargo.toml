[package]
name = "adaq-python-research"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Tauri-independent Python Research project and archive contracts for ADAQ"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hmac = "0.13"
flate2 = "1"
libc = "0.2"
tar = "0.4"
toml = "0.8"
zip = { version = "8", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
